<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PalmnexReaDS — Agronomy Research Portal Login</title>
  <meta name="description" content="PalmnexReaDS: MPOB / PORIM Relational Database for Oil Palm Agronomy Research Trials. Secure Research Station Access Portal.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/reada.css">
</head>
<body>

<div class="app-container">

  <!-- ================= ReaDA Main Menu Sidebar (Login Screen: Header Only, Rest Empty) ================= -->
  <aside class="app-sidebar" aria-label="PalmnexReaDS Sidebar">
    <div class="sidebar-header">
      <div class="brand-icon" aria-hidden="true">
        <img src="assets/img/palmnex-logo.png" alt="PalmnexReaDS Logo">
      </div>
      <div>
        <div class="brand-title">PalmnexReaDS</div>
        <div class="brand-subtitle">MPOB Oil Palm Agronomy Engine</div>
      </div>
    </div>
    <!-- Left panel contents intentionally empty during login screen per specifications -->
  </aside>

  <!-- ================= Main Area: Full-Window Background Photo with Login Card ================= -->
  <main class="app-main app-main-login" style="background-image: url('assets/img/palmnex-hero.png'); background-position: calc(50% + 60px) center;">
    
    <!-- Dark Vignette Backdrop Filter -->
    <div class="login-backdrop-overlay"></div>

    <!-- Center Floating Account Access / Login Popup Card -->
    <div class="login-card">
      <div class="login-card-header">
        <div class="login-brand-icon">
          <img src="assets/img/palmnex-logo.png" alt="PalmnexReaDS Logo">
        </div>
        <h1 class="login-title" style="margin: 0; font-size: 1.35rem;">Account Access</h1>
        <p class="login-subtitle" style="margin: 0;">
          Sign in or register to sync your PALMNEX data<br>
          <span style="font-size: 0.72rem; color: #166534; font-weight: 600;">MPOB PalmnexReaDS Research &amp; Database Engine</span>
        </p>
      </div>

      <!-- Segmented Tab Switcher (Sign In / Register) -->
      <div class="auth-tabs" role="tablist">
        <button type="button" id="auth-tab-signin" class="auth-tab-btn active" role="tab" aria-selected="true" onclick="switchAuthTab('signin')">Sign In</button>
        <button type="button" id="auth-tab-signup" class="auth-tab-btn" role="tab" aria-selected="false" onclick="switchAuthTab('signup')">Register</button>
      </div>

      <!-- Alert Notification Banners -->
      <div id="auth-error-msg" class="auth-alert auth-alert-error" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px; flex-shrink: 0;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="auth-error-text">Authentication failed</span>
      </div>

      <div id="auth-success-msg" class="auth-alert auth-alert-success" role="status">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px; flex-shrink: 0;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <span id="auth-success-text">Authenticated successfully</span>
      </div>

      <!-- FORM 1: Sign In -->
      <form id="auth-form-signin" class="login-form" onsubmit="handleEmailSignIn(event)">
        <div class="login-field">
          <label for="signin-email" class="login-label">
            <span>Username or Email</span>
            <span style="font-size: 0.72rem; color: var(--text-faint); font-weight: 400;">Supabase / MPOB</span>
          </label>
          <div class="login-input-wrap">
            <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="signin-email" class="login-input" placeholder="admin1 or email@domain.com" value="admin1" required autocomplete="username">
          </div>
        </div>

        <div class="login-field">
          <label for="signin-password" class="login-label">
            <span>Password</span>
            <a href="javascript:void(0)" onclick="handleForgotPassword()" style="font-size: 0.72rem; color: var(--brand-green); text-decoration: none;">Forgot?</a>
          </label>
          <div class="login-input-wrap">
            <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="signin-password" class="login-input" placeholder="••••••••" value="admin1" required autocomplete="current-password">
          </div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.78rem; color: var(--text-muted);">
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
            <input type="checkbox" id="signin-remember" checked style="accent-color: var(--brand-green);">
            <span>Remember login session</span>
          </label>
          <span style="font-size: 0.72rem; color: var(--text-faint);">V2.0 2026</span>
        </div>

        <div class="login-actions">
          <button type="submit" class="login-btn-primary" id="btn-auth-signin" style="background-color: #10b981;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 17px; height: 17px;"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            <span id="btn-signin-text">Sign In</span>
          </button>
          <button type="button" class="login-btn-demo" id="btn-login-guest" onclick="handleGuestAccess()">
            <span>Direct Access / Researcher Demo &rarr;</span>
          </button>
        </div>
      </form>

      <!-- FORM 2: Register (Synced with Supabase Auth) -->
      <form id="auth-form-signup" class="login-form" style="display: none;" onsubmit="handleEmailSignUp(event)">
        <div class="login-field">
          <label for="signup-name" class="login-label">
            <span>Full Name</span>
          </label>
          <div class="login-input-wrap">
            <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="signup-name" class="login-input" placeholder="e.g. Dr. Siti Aisyah" autocomplete="name">
          </div>
        </div>

        <div class="login-field">
          <label for="signup-email" class="login-label">
            <span>Username or Email</span>
          </label>
          <div class="login-input-wrap">
            <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"/></svg>
            <input type="email" id="signup-email" class="login-input" required placeholder="name@mpob.gov.my" autocomplete="email">
          </div>
        </div>

        <div class="login-field">
          <label for="signup-password" class="login-label">
            <span>Password</span>
          </label>
          <div class="login-input-wrap">
            <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="signup-password" class="login-input" required placeholder="••••••••" autocomplete="new-password">
          </div>
        </div>

        <div class="login-field">
          <label for="signup-confirm-password" class="login-label">
            <span>Confirm Password</span>
          </label>
          <div class="login-input-wrap">
            <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="signup-confirm-password" class="login-input" required placeholder="••••••••" autocomplete="new-password">
          </div>
        </div>

        <div class="login-actions">
          <button type="submit" class="login-btn-primary" id="btn-auth-signup" style="background-color: #0284c7;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 17px; height: 17px;"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
            <span id="btn-signup-text">Register Account</span>
          </button>
        </div>
      </form>

      <div class="login-security-notice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px; color: var(--brand-green); flex-shrink: 0;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span>Restricted Access: Authorized MPOB / PORIM Agronomy &amp; Plant Nutrition Personnel Only</span>
      </div>
    </div>

  </main>

</div>

<!-- Supabase SDK & Config -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js"></script>

<script>
  function showAuthError(msg) {
    const errorEl = document.getElementById('auth-error-msg');
    const errorText = document.getElementById('auth-error-text');
    const successEl = document.getElementById('auth-success-msg');
    if (successEl) successEl.style.display = 'none';
    if (!errorEl) return;
    if (msg) {
      errorText.textContent = msg;
      errorEl.style.display = 'flex';
    } else {
      errorEl.style.display = 'none';
    }
  }

  function showAuthSuccess(msg) {
    const errorEl = document.getElementById('auth-error-msg');
    const successEl = document.getElementById('auth-success-msg');
    const successText = document.getElementById('auth-success-text');
    if (errorEl) errorEl.style.display = 'none';
    if (!successEl) return;
    if (msg) {
      successText.textContent = msg;
      successEl.style.display = 'flex';
    } else {
      successEl.style.display = 'none';
    }
  }

  function switchAuthTab(tabName) {
    showAuthError(null);
    showAuthSuccess(null);
    const tabSignin = document.getElementById('auth-tab-signin');
    const tabSignup = document.getElementById('auth-tab-signup');
    const formSignin = document.getElementById('auth-form-signin');
    const formSignup = document.getElementById('auth-form-signup');

    if (tabName === 'signin') {
      tabSignin.classList.add('active');
      tabSignin.setAttribute('aria-selected', 'true');
      tabSignup.classList.remove('active');
      tabSignup.setAttribute('aria-selected', 'false');
      formSignin.style.display = 'flex';
      formSignup.style.display = 'none';
    } else {
      tabSignup.classList.add('active');
      tabSignup.setAttribute('aria-selected', 'true');
      tabSignin.classList.remove('active');
      tabSignin.setAttribute('aria-selected', 'false');
      formSignup.style.display = 'flex';
      formSignin.style.display = 'none';
    }
  }

  async function handleEmailSignIn(event) {
    if (event) event.preventDefault();
    const emailInput = document.getElementById('signin-email');
    const passwordInput = document.getElementById('signin-password');
    const rememberMe = document.getElementById('signin-remember')?.checked;
    const btn = document.getElementById('btn-auth-signin');
    const btnText = document.getElementById('btn-signin-text');

    const rawInput = emailInput ? emailInput.value.trim() : '';
    const password = passwordInput ? passwordInput.value : '';

    if (!rawInput || !password) {
      showAuthError("Please enter your username/email and password.");
      return;
    }

    if (rememberMe) {
      localStorage.setItem('palmnex_remember_me', 'true');
    } else {
      localStorage.removeItem('palmnex_remember_me');
    }

    // Set loading state
    if (btn) btn.disabled = true;
    if (btnText) btnText.innerHTML = `Verifying...`;

    // 1. Check if user is testing with standard demo credentials (admin1/admin1)
    if (rawInput === 'admin1' && (password === 'admin1' || password === 'porim1998')) {
      const demoUser = {
        id: 'usr_demo_admin1',
        email: 'admin1@palmnex.mpob.gov.my',
        username: 'admin1',
        user_metadata: { full_name: 'Lead Agronomist (Admin)' }
      };
      localStorage.setItem('palmnex_user_session', JSON.stringify(demoUser));
      localStorage.setItem('reada_logged_in', 'true');
      showAuthSuccess("Welcome admin1! Connecting to PalmnexReaDS...");
      setTimeout(() => {
        window.location.href = 'list-available-data.html';
      }, 700);
      return;
    }

    // 2. Format email if plain username
    let emailToAuth = rawInput;
    if (!emailToAuth.includes('@')) {
      emailToAuth = `${rawInput}@palmnex.mpob.gov.my`;
    }

    // 3. Supabase Auth attempt
    const client = typeof window.getSupabase === 'function' ? window.getSupabase() : null;
    if (client && client.auth) {
      try {
        const { data, error } = await client.auth.signInWithPassword({
          email: emailToAuth,
          password: password
        });

        if (error) {
          // If Supabase returned an error, display it clearly
          showAuthError(error.message || "Invalid credentials with Supabase.");
          if (btn) btn.disabled = false;
          if (btnText) btnText.innerHTML = `Sign In`;
          return;
        }

        if (data && data.user) {
          localStorage.setItem('palmnex_user_session', JSON.stringify(data.user));
          localStorage.setItem('reada_logged_in', 'true');
          showAuthSuccess("Supabase Verified! Syncing your PALMNEX data...");
          setTimeout(() => {
            window.location.href = 'list-available-data.html';
          }, 600);
          return;
        }
      } catch (err) {
        console.warn("Supabase Auth error:", err);
        showAuthError(err.message || "Network error communicating with Supabase.");
        if (btn) btn.disabled = false;
        if (btnText) btnText.innerHTML = `Sign In`;
        return;
      }
    }

    // Fallback if client isn't available
    localStorage.setItem('reada_logged_in', 'true');
    showAuthSuccess("Authenticated in offline mode! Entering PalmnexReaDS...");
    setTimeout(() => {
      window.location.href = 'list-available-data.html';
    }, 600);
  }

  async function handleEmailSignUp(event) {
    if (event) event.preventDefault();
    const name = document.getElementById('signup-name')?.value?.trim();
    const email = document.getElementById('signup-email')?.value?.trim();
    const password = document.getElementById('signup-password')?.value;
    const confirmPassword = document.getElementById('signup-confirm-password')?.value;
    const btn = document.getElementById('btn-auth-signup');
    const btnText = document.getElementById('btn-signup-text');

    if (!email || !password) {
      showAuthError("Please fill in email and password.");
      return;
    }
    if (password !== confirmPassword) {
      showAuthError("Passwords do not match.");
      return;
    }
    if (password.length < 6) {
      showAuthError("Password must be at least 6 characters.");
      return;
    }

    const client = typeof window.getSupabase === 'function' ? window.getSupabase() : null;
    if (!client || !client.auth) {
      showAuthError("Supabase client is not available.");
      return;
    }

    if (btn) btn.disabled = true;
    if (btnText) btnText.innerHTML = `Registering...`;

    try {
      const { data, error } = await client.auth.signUp({
        email: email,
        password: password,
        options: {
          data: { full_name: name || 'Research Officer' }
        }
      });

      if (error) {
        showAuthError(error.message);
        if (btn) btn.disabled = false;
        if (btnText) btnText.innerHTML = `Register Account`;
        return;
      }

      showAuthSuccess("Registration received! Please check your email or proceed to Sign In.");
      setTimeout(() => {
        switchAuthTab('signin');
        const emailInput = document.getElementById('signin-email');
        if (emailInput) emailInput.value = email;
      }, 1800);
    } catch (err) {
      showAuthError(err.message || "Failed to register account.");
      if (btn) btn.disabled = false;
      if (btnText) btnText.innerHTML = `Register Account`;
    }
  }

  function handleGuestAccess() {
    localStorage.setItem('reada_logged_in', 'guest');
    showAuthSuccess("Entering as Guest Researcher...");
    setTimeout(() => {
      window.location.href = 'list-available-data.html';
    }, 450);
  }

  function handleForgotPassword() {
    alert("To reset your password, contact MPOB Station Admin or request a password reset email via your registered Supabase email address.");
  }
</script>

</body>
</html>
